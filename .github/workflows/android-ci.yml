# Cloud Android build and emulator QA. Not executed in this chat.
# Test artifact uses a different application ID so v1.1 data is not endangered.
name: Unlock Audit v2 - build and test
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build_and_unit_test:
    name: JVM tests, lint, and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android 16 SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Execute unit tests, lint, compile preview APK and Android test APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Verify test APK signature and safe preview package name
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep "package: name='com.raghava.unlockaudit.preview'"
      - uses: actions/upload-artifact@v4
        with:
          name: unverified-preview-build
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  emulator_tests:
    name: Emulator tests on Android API ${{ matrix.api }}
    runs-on: ubuntu-latest
    needs: build_and_unit_test
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android 16 build SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Run Room and Compose instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-boot-timeout: 900
          script: gradle --no-daemon :app:connectedDebugAndroidTest --stacktrace

  promote_qa_preview:
    name: Publish emulator-verified preview APK (NOT a production release)
    runs-on: ubuntu-latest
    needs: [build_and_unit_test, emulator_tests]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: unverified-preview-build
          path: qa
      - name: Rename preview APK
        run: mv qa/app-debug.apk qa/UnlockAudit-v2.0-S26-Ultra-QA-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: UnlockAudit-v2.0-Android16-QA-preview
          path: qa/UnlockAudit-v2.0-S26-Ultra-QA-preview.apk
          retention-days: 30
